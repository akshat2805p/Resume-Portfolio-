<html lang="en" data-sky="night">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="description"
    content="Portfolio of Akshat Pandey — Computer Science undergraduate at VIT Bhopal, Summer Fellow at IIT Bombay FOSSEE, and LeetCode Knight. Building distributed systems, open-source EDA tools, and machine learning telemetry." />

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Akshat Pandey · Systems Engineer &amp; Software Builder" />
  <meta property="og:description"
    content="Production AI platforms, distributed Go key-value stores, and KiCad EDA automation plugins built by Akshat Pandey." />
  <meta property="og:image" content="https://resume-portfolio-sandy.vercel.app/og-preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Akshat Pandey · Systems Engineer" />

    content="FOSSEE Fellow at IIT Bombay · LeetCode Knight · Distributed Systems &amp; AI." />

  <!-- Google Fonts: Shivam Kumar Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Dawning+of+a+New+Day&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&family=Instrument+Serif:ital@0;1&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <script>
    /* Day or night from viewer's own clock before first paint */
    (function () {
      try {
        var saved = localStorage.getItem('akshat_sky');
        if (saved) {
          document.documentElement.setAttribute('data-sky', saved);
        } else {
          var d = new Date(), h = d.getHours() + d.getMinutes() / 60;
          document.documentElement.setAttribute('data-sky', (h >= 6 && h < 18) ? 'day' : 'night');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
